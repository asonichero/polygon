<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose editor — Gerda holding Jack</title>
<style>
  html, body { margin: 0; height: 100%; background: #14181f; color: #e8e6e3; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 38px; display: flex; gap: 6px; align-items: center; padding: 0 10px; background: #0d1018; border-bottom: 1px solid #2c2c36; z-index: 5; }
  #bar button { background: #2e2e3a; color: #e8e6e3; border: 1px solid #454555; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; } #bar button.on { background: #6b5a2a; border-color: #c9a84c; color: #fff; }
  #bar span { font-size: 12px; color: #8a8a96; margin-left: 8px; }
  iframe { position: fixed; top: 38px; left: 0; width: 100%; height: calc(100% - 38px); border: 0; }
</style>
</head>
<body>
<div id="bar"><button data-p="pose-editor-half.html" class="on">Half size: carried, across her knee</button><button data-p="pose-editor-fist.html">Tiny Jack in her fist</button><span>Both poses of Gerda holding Jack. (The arm poses over the knee are in Correction positions, lap.html.)</span></div>
<iframe id="f" src="pose-editor-half.html"></iframe>
<script>
document.querySelectorAll('#bar button').forEach(function (b) { b.onclick = function () { document.querySelectorAll('#bar button').forEach(function (x) { x.classList.toggle('on', x === b); }); document.getElementById('f').src = b.dataset.p; }; });
</script>
</body>
</html>
